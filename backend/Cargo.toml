[workspace]
resolver = "2"
members = ["crates/api"]

[workspace.package]
edition = "2021"
# Raised from 1.80 so `cargo add` stops silently holding dependencies back to
# older majors. Bump this deliberately when a dependency needs it, rather than
# tracking the newest toolchain for its own sake — it is the floor a contributor
# or CI runner must meet.
rust-version = "1.88"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
