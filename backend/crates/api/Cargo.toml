[package]
name = "pixmyday-api"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[lib]
name = "pixmyday_api"
path = "src/lib.rs"

[[bin]]
name = "api"
path = "src/main.rs"

# Prints the OpenAPI document without starting the server, so the BFF's
# TypeScript client can be generated from a checkout alone (ADR-0014).
[[bin]]
name = "openapi"
path = "src/bin/openapi.rs"

# Creates the first athlete of a deployment, once (ADR-0016). Deliberately a
# binary rather than an endpoint, so a production router contains no
# unauthenticated account-creating path at all.
[[bin]]
name = "bootstrap"
path = "src/bin/bootstrap.rs"

# Dumps the pictogram vocabulary and appearance enums as JSON for the offline
# batch-generation tool (ADR-0023). No server, no DB — a checkout alone
# suffices, same reasoning as `openapi` above.
[[bin]]
name = "vocabulary"
path = "src/bin/vocabulary.rs"

# Imports the human-approved output of scripts/pictogram-batch/ into the
# curated pictogram library (ADR-0023): writes S3 objects and upserts
# `pictogram_library` rows. The only writer of that table — the running
# server only ever selects from it.
[[bin]]
name = "library-import"
path = "src/bin/library_import.rs"

# offline password reset for an existing athlete — there is no reset
# endpoint, and `bootstrap` refuses once any athlete exists.
[[bin]]
name = "set-password"
path = "src/bin/set_password.rs"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tower-http = { version = "0.6", features = ["trace", "cors"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "macros", "migrate"] }
uuid = { version = "1.20.0", features = ["v7", "serde"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
utoipa = { version = "5.5.0", features = ["axum_extras", "uuid", "chrono"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }
thiserror = "2.0.19"
dotenvy = "0.15.7"
# jsonwebtoken 10 made the crypto backend pluggable and panics at *runtime* if
# neither provider feature is on — `default` only enables `use_pem`. rust_crypto
# is pure Rust, so no cmake/C toolchain is needed to build, which keeps both the
# Windows dev setup and the Linux container image simple; it also reuses the
# ed25519-dalek already in the tree rather than pulling in a second Ed25519.
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
argon2 = { version = "0.5.3", features = ["std"] }
base64 = "0.22.1"
rand = "0.9.5"
sha2 = "0.10.9"
# SHA-1, used for exactly one thing: the Pwned Passwords range API, whose index
# is keyed on SHA-1 and nothing else. Never used to store or verify a credential.
sha1 = "0.10.6"
# Decompresses the bundled breached-password corpus once at startup. Pure Rust
# backend, so no zlib/C toolchain — same reasoning as `jsonwebtoken`'s
# `rust_crypto` above.
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
# The optional, off-by-default HIBP range lookup (ADR-0011). rustls with
# bundled webpki roots rather than the platform trust store, so the container
# image needs no ca-certificates package and the outbound call is the only
# new moving part. Just `rustls-tls`: the HIBP path reads a plain-text body,
# so there is no JSON feature to enable.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
ed25519-dalek = { version = "3", features = ["pkcs8", "rand_core", "pem"] }
pixmyday-domain = { version = "0.1.0", path = "../domain" }
# Object storage (ADR-0010). The official SDK rather than a thin S3 wrapper
# because SigV4, retries, and checksum handling are exactly the things a
# hand-rolled client gets subtly wrong. `aws-config` is deliberately NOT pulled
# in: credentials and endpoint come from our own `Config::from_env`, so the SDK
# never reaches for an instance-metadata service or `~/.aws/credentials` and
# cannot silently talk to a bucket nobody configured.
aws-sdk-s3 = { version = "1.122.0", default-features = false, features = ["rt-tokio", "default-https-client"] }
# Decode, resize, and the lossless master encode. Only the three input formats
# we accept are compiled in, so an unexpected format cannot even be decoded by
# accident.
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
# Lossy WebP for the two served derivatives (ADR-0010 amendment). `image` has no
# lossy WebP encoder — only lossless — and ADR-0010 proxies every byte through
# Axum with no CDN, so derivative size is paid again on every view. That is worth
# a C toolchain in the build, which the rest of the tree still avoids.
#
# libwebp-sys rather than the `webp` crate: `webp` 0.3.1 pins libwebp-sys 0.9,
# which vendors libwebp 1.3.1 — the release immediately before the 1.3.2 that
# fixed CVE-2023-4863. We only encode, so that particular decoder bug is not
# reachable from here, but shipping a known-vulnerable libwebp into the container
# image is not a thing to do on purpose. 0.14.4 vendors libwebp 1.6.0 and is the
# maintained line. It builds the C sources with `cc` and links them statically,
# so there is no system libwebp to install on a dev box or in a builder stage.
#
# It is a raw FFI crate; the entire unsafe surface is `pipeline::encode_lossy`.
libwebp-sys = { version = "0.14.4", default-features = false, features = ["std", "parallel"] }
# `ReaderStream`, to hand an S3 body to axum without buffering it (ADR-0010
# proxies bytes; buffering a 20 MB master per concurrent request would not do).
tokio-util = { version = "0.7.18", default-features = false, features = ["io"] }
# Outbound SMTP — the invitation mail (spec: .scratch/invitation-mail). rustls
# rather than native-tls for the same no-C-toolchain reasoning as `reqwest` and
# `jsonwebtoken` above; the provider is any EU SMTP relay, Mailpit in dev.
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "hostname", "tokio1", "tokio1-rustls-tls"] }

[dev-dependencies]
axum-test = "21"
# Tests only: proves the EXIF fixture really carries GPS before upload, and that
# the stored derivatives carry no Exif container at all afterwards. The
# implementation never parses Exif with it — stripping is a property of
# re-encoding from raw pixels, not of a metadata filter.
kamadak-exif = "0.6.1"
