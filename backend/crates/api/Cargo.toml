[package]
name = "athletos-api"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[lib]
name = "athletos_api"
path = "src/lib.rs"

[[bin]]
name = "api"
path = "src/main.rs"

# Prints the OpenAPI document without starting the server, so the BFF's
# TypeScript client can be generated from a checkout alone (ADR-0014).
[[bin]]
name = "openapi"
path = "src/bin/openapi.rs"

# offline password reset for an existing athlete — there is no reset
# endpoint, and this is the only recovery path there is (D-02).
[[bin]]
name = "set-password"
path = "src/bin/set_password.rs"

[dependencies]
axum = "0.8"
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tower-http = { version = "0.6", features = ["trace", "cors"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "macros", "migrate"] }
uuid = { version = "1.20.0", features = ["v7", "serde"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
utoipa = { version = "5.5.0", features = ["axum_extras", "uuid", "chrono"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }
thiserror.workspace = true
dotenvy = "0.15.7"
# The training engine (D-03). Pure: no sqlx, no axum, no clock. Everything the
# API does with a program goes through `&dyn Program`.
athletos-training = { path = "../training" }
# jsonwebtoken 10 made the crypto backend pluggable and panics at *runtime* if
# neither provider feature is on — `default` only enables `use_pem`. rust_crypto
# is pure Rust, so no cmake/C toolchain is needed to build, which keeps both the
# Windows dev setup and the Linux container image simple; it also reuses the
# ed25519-dalek already in the tree rather than pulling in a second Ed25519.
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
argon2 = { version = "0.5.3", features = ["std"] }
base64 = "0.22.1"
rand = "0.9.5"
sha2 = "0.10.9"
# SHA-1, used for exactly one thing: the Pwned Passwords range API, whose index
# is keyed on SHA-1 and nothing else. Never used to store or verify a credential.
sha1 = "0.10.6"
# Decompresses the bundled breached-password corpus once at startup. Pure Rust
# backend, so no zlib/C toolchain — same reasoning as `jsonwebtoken`'s
# `rust_crypto` above.
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
# The optional, off-by-default HIBP range lookup (ADR-0011). rustls with
# bundled webpki roots rather than the platform trust store, so the container
# image needs no ca-certificates package and the outbound call is the only
# new moving part. Just `rustls-tls`: the HIBP path reads a plain-text body,
# so there is no JSON feature to enable.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
ed25519-dalek = { version = "3", features = ["pkcs8", "rand_core", "pem"] }

[dev-dependencies]
axum-test = "21"
