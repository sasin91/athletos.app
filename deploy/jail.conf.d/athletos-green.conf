/*
 * The green jail. Identical to athletos-blue.conf apart from the path, the
 * hostname, the address and the fstab — see that file for why these are
 * hand-written and static.
 *
 * Green is updated first by deploy.sh, on the reasoning that if a release is
 * going to fail it should fail against the jail that is not currently the one
 * everything happens to be routed to. In practice Caddy balances across both,
 * so "first" only means "the one whose failure leaves the other serving".
 */
athletos-green {
	path = "/jails/green";
	host.hostname = "green.athletos.internal";

	ip4.addr = 10.0.0.3;

	exec.start = "/bin/sh /etc/rc";
	exec.stop = "/bin/sh /etc/rc.shutdown jail";
	exec.consolelog = "/var/log/jail_athletos-green_console.log";
	exec.clean;

	mount.devfs;
	devfs_ruleset = 4;
	mount.fstab = "/etc/fstab.athletos-green";

	allow.set_hostname = 0;
	allow.raw_sockets = 0;
	allow.sysvipc = 0;
	allow.chflags = 0;
	allow.mount = 0;
	enforce_statfs = 2;
}
