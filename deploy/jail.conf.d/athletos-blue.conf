/*
 * The blue jail. Hand-written, static, and never generated.
 *
 * The two snippets in this directory differ in exactly two lines — the path and
 * the address — and that is deliberate. A deploy that generated jail
 * configuration would be a deploy that could generate it wrong, at the worst
 * possible moment; these are read once at boot and are the same bytes on every
 * release. Both jails run at all times, and Caddy health-checks both, so a
 * crashed backend fails over without anyone deploying anything.
 *
 * The read-only base and the writable layer are joined by nullfs mounts listed
 * in /etc/fstab.athletos-blue, written by infra/bootstrap.sh.
 */
athletos-blue {
	path = "/jails/blue";
	host.hostname = "blue.athletos.internal";

	/*
	 * The address is named, not created. bootstrap.sh puts both aliases on
	 * lo1 permanently via rc.conf; jail(8) is given no `interface` here, so
	 * it restricts this jail to 10.0.0.2 and touches no interface itself.
	 * A jail that manages its own addresses is a jail whose addressing can
	 * differ between a start and a restart.
	 */
	ip4.addr = 10.0.0.2;

	exec.start = "/bin/sh /etc/rc";
	exec.stop = "/bin/sh /etc/rc.shutdown jail";
	exec.consolelog = "/var/log/jail_athletos-blue_console.log";
	exec.clean;

	mount.devfs;
	devfs_ruleset = 4;
	mount.fstab = "/etc/fstab.athletos-blue";

	/*
	 * Nothing in here needs any of these. Postgres runs on the host, so not
	 * even sysvipc.
	 */
	allow.set_hostname = 0;
	allow.raw_sockets = 0;
	allow.sysvipc = 0;
	allow.chflags = 0;
	allow.mount = 0;
	enforce_statfs = 2;
}
