# sanoid — local ZFS snapshots with tiered retention.
#
# Installed to /usr/local/etc/sanoid/sanoid.conf by infra/bootstrap.sh, which
# rewrites `zroot/` to whatever the pool is actually called.
#
# These are an undo button, not a backup. They live on the same disk as the
# thing they protect and share its failure domain completely: a dead disk, a
# destroyed pool or a deleted server takes the snapshots with it. What they buy
# is the other kind of accident, which is the common one — a bad migration, a
# `delete` without a `where`, a deploy that corrupted something at 14:05. Being
# able to say "give me 14:00" and have it in two seconds is worth a great deal,
# and it is a different thing from what backup.sh does.
#
# The honest division of labour:
#
#   sanoid      mistakes. Instant, free, same disk.
#   backup.sh   disasters. Slow, offsite, encrypted, and the only one that
#               survives losing the machine.
#
# syncoid is deliberately not part of this. Replicating these snapshots to a
# second ZFS host would be strictly better than the pg_dump, and it is the
# obvious next step if a second box ever exists — but rsync.net's ZFS product
# has a 10 TB minimum, which is three orders of magnitude more storage than this
# needs, and a Hetzner Storage Box does not speak ZFS. So the offsite artifact
# is a dump over SSH, and this stays local.

[zroot/data/pgdata]
	use_template = database
	recursive = no

[zroot/jails/blue]
	use_template = ephemeral
	recursive = no

[zroot/jails/green]
	use_template = ephemeral
	recursive = no

# The OS itself. bectl boot environments already cover "the upgrade broke it",
# and this covers everything between them.
[zroot/ROOT/default]
	use_template = system
	recursive = no

#############################

# The one dataset that matters. Frequent snapshots are cheap here — the working
# set is small and the churn is one athlete's worth of writes — so they are
# taken every fifteen minutes and kept for a day.
#
# These are crash-consistent, not application-consistent: a snapshot of a
# running Postgres is exactly what Postgres would see after a power cut, and it
# recovers from that at startup the same way. That is fine, and it is also why
# it is not the backup.
[template_database]
	frequently = 4
	frequent_period = 15
	hourly = 36
	daily = 14
	monthly = 3
	yearly = 0
	autosnap = yes
	autoprune = yes

# The jails hold nothing that is not either in the base, in a release, or
# reconstructible by bootstrap.sh. A day of snapshots is enough to answer "what
# did that jail look like before the deploy".
[template_ephemeral]
	frequently = 0
	hourly = 12
	daily = 3
	monthly = 0
	yearly = 0
	autosnap = yes
	autoprune = yes

[template_system]
	frequently = 0
	hourly = 0
	daily = 14
	monthly = 3
	yearly = 0
	autosnap = yes
	autoprune = yes
